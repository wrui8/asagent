name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Stamp desktop version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" "$VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build web
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Check updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY，桌面自动更新包无法签名（见 docs/deploy.md）"
            exit 1
          fi

      - name: Build Tauri bundle
        run: npm run build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: asagent-windows-nsis
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Stamp mobile version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='app/app.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.expo.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" "$VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: app

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME is not set"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asagent-release.p12"
          UNSIGNED=app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=$(find app/android/app/build/outputs/apk/release -name '*.apk' ! -name '*-android.apk' | head -n 1)
          fi
          test -n "$UNSIGNED" && test -f "$UNSIGNED"
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          OUT="app/android/app/build/outputs/apk/release/asagent-${GITHUB_REF_NAME:-dev}-android.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/asagent-release.p12" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$OUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: asagent-android-apk
          path: app/android/app/build/outputs/apk/release/asagent-*-android.apk
          if-no-files-found: error

  publish:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Build desktop update manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          version = os.environ["VERSION"].lstrip("v")
          root = pathlib.Path("dist/asagent-windows-nsis")
          # Tauri <= 2.0 产出 *.nsis.zip；2.1+ 直接以 setup.exe 作为更新包，
          # 签名文件为 *.exe.sig。两种布局都兼容，避免发版因命名变化失败。
          zips = sorted(root.glob("*.nsis.zip"))
          if zips:
              archive = zips[0]
              signature = archive.with_name(archive.name + ".sig")
          else:
              exes = sorted(root.glob("*-setup.exe")) or sorted(root.glob("*.exe"))
              if not exes:
                  raise SystemExit("no NSIS installer or .nsis.zip updater artifact found")
              archive = exes[0]
              signature = archive.with_name(archive.name + ".sig")
          if not signature.exists():
              raise SystemExit(f"missing updater signature: {signature}")

          manifest = {
              "version": version,
              "notes": "桌面端自动更新：下载完成后安装程序会自动完成升级。",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": {
                  "windows-x86_64": {
                      "signature": signature.read_text(encoding="utf-8").strip(),
                      "url": (
                          f"https://github.com/{os.environ['REPO']}/releases/download/"
                          f"{os.environ['TAG']}/{archive.name}"
                      ),
                  }
              },
          }
          pathlib.Path("dist/latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"latest.json → version {version}, {archive.name}")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asagent-windows-nsis/*.exe
            dist/asagent-windows-nsis/*.exe.sig
            dist/asagent-windows-nsis/*.nsis.zip
            dist/asagent-windows-nsis/*.nsis.zip.sig
            dist/asagent-android-apk/*.apk
            dist/latest.json
          body: |
            ## 安装包

            - **Windows 桌面端**：`asagent_*_x64-setup.exe`（NSIS；未做代码签名，SmartScreen 可能提示）
            - **桌面自动更新**：已安装的客户端通过 `latest.json` + 签名更新包静默升级
            - **Android**：`asagent-*-android.apk`（签名 release，可直接安装；应用内会提示新版本）
            - **Web**：https://agent.woaiwyj.xin

            iOS 需要 macOS + Apple 签名环境，暂不提供。
