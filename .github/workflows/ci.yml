name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra rag

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log

      - name: Publish failure summary
        if: failure()
        run: |
          {
            echo "## Test failure"
            echo '```'
            tail -n 150 pytest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done || true
          {
            grep -A12 -m1 "ERROR collecting" pytest.log || tail -n 15 pytest.log
          } | head -13 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=pytest-trace::${line:0:900}"
          done || true
          grep -E "^E +" pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest-error::${line:0:900}"
          done || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen --extra rag

      - name: Build web
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install e2e dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright
        run: npx playwright test
        working-directory: e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 只在 main 推送时发布镜像；PR 只做构建校验
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # 生产镜像（含 RAG，使用海外官方源；GHCR 上缓存层可复用）
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_RAG=1
            WITH_DOCKER_CLI=1
            PIP_INDEX_URL=https://pypi.org/simple
            PYPI_FILES_MIRROR=
            NPM_REGISTRY=https://registry.npmjs.org
            APT_MIRROR=
            TORCH_WHEEL_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max
