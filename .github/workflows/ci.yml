name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 阶段 2：PostgreSQL 仓储用例需要真实实例；未提供 DSN 时自动 skip
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asagent
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: asagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asagent -d asagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AS_TEST_PG_DSN: postgresql://asagent:ci-test-only@127.0.0.1:5432/asagent_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra rag --extra milvus --extra state

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee pytest.log

      - name: Publish failure summary
        if: failure()
        run: |
          {
            echo "## Test failure"
            echo '```'
            tail -n 150 pytest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done || true
          {
            grep -A12 -m1 "ERROR collecting" pytest.log || tail -n 15 pytest.log
          } | head -13 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=pytest-trace::${line:0:900}"
          done || true
          grep -E "^E +" pytest.log | head -10 | while IFS= read -r line; do
            echo "::error title=pytest-error::${line:0:900}"
          done || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只做语法与插值校验，不启动容器；dummy 密码仅用于满足 fail-closed 占位
      - name: Validate compose profiles
        env:
          AS_PG_PASSWORD: ci-dummy-not-a-secret
          AS_RABBITMQ_PASSWORD: ci-dummy-not-a-secret
          # 宿主的 Windows 路径默认值在 Linux runner 上不合法，显式覆盖为 POSIX 路径
          BGE_MODEL_DIR: /tmp/models
          BGE_M3_DIR: /tmp/models
          DOCKER_SOCKET: /var/run/docker.sock
          AS_SANDBOX_PATH_MAP: /app/runtime=/tmp/runtime
        run: |
          # 根 .env 不入库，占位满足 api / memory-worker 的 env_file 必填校验
          : > .env
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml --profile state config -q
          docker compose -f deploy/docker-compose.yml --profile rag config -q
          docker compose -f deploy/docker-compose.yml --profile memory config -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install Python dependencies
        run: uv sync --frozen --extra rag

      - name: Build web
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install e2e dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright
        run: npx playwright test
        working-directory: e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 只在 main 推送时发布镜像；PR 只做构建校验
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # 生产镜像（含 RAG，使用海外官方源；GHCR 上缓存层可复用）
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_RAG=1
            WITH_DOCKER_CLI=1
            PIP_INDEX_URL=https://pypi.org/simple
            PYPI_FILES_MIRROR=
            NPM_REGISTRY=https://registry.npmjs.org
            APT_MIRROR=
            TORCH_WHEEL_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max
