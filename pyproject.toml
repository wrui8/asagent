[project]
name = "asagent"
version = "0.1.0"
description = "学习型企业级 Agent 底座：手写运行时 + 场景包 + 评测闭环"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "json-repair>=0.30",
    "mcp>=2.3.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "langgraph>=0.2,<2",
]

[project.optional-dependencies]
# RAG 场景包依赖；CPU 版 torch，避免与 vLLM 抢显存
# torch 必须直接声明，tool.uv.sources 只对直接依赖生效（否则会解析成 CUDA 版）
rag = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "torch>=2.15,<2.16",
]
# Milvus 向量后端（阶段 1）；TEI 编码通过 HTTP 调用，无额外 Python 依赖。
# 客户端大版本需与服务端一致：compose 固定 milvusdb/milvus:v2.5.x
milvus = [
    "pymilvus>=2.4,<2.6",
]
# 存储分层（阶段 2）：PostgreSQL 权威库 + Redis 共享状态；驱动均延迟导入。
# 未启用 AS_STORAGE_BACKEND=postgres / AS_REDIS_URL 时保持 SQLite 单机行为。
state = [
    "aio-pika>=9.4",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis[lua]>=2.41.0",
]

[project.scripts]
asagent = "asagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501：提示词/长 SQL 字符串不宜强制折行；UP046：保持 Generic 写法兼容 Protocol 定义
ignore = ["E501", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入必须写成参数默认值
"src/asagent/api/**" = ["B008"]

[tool.ruff.lint.isort]
# 显式声明第一方包，避免不同检出环境下将 asagent.* 误判为第三方导致 I001 不稳定
known-first-party = ["asagent"]
