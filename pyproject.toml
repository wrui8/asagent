[project]
name = "asagent"
version = "0.1.0"
description = "学习型企业级 Agent 底座：手写运行时 + 场景包 + 评测闭环"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "json-repair>=0.30",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
# RAG 场景包依赖；CPU 版 torch，避免与 vLLM 抢显存
rag = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
asagent = "asagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501：提示词/长 SQL 字符串不宜强制折行；UP046：保持 Generic 写法兼容 Protocol 定义
ignore = ["E501", "UP046"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.isort]
# 显式声明第一方包，避免不同检出环境下将 asagent.* 误判为第三方导致 I001 不稳定
known-first-party = ["asagent"]
